name: Windows launcher build
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-package:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pyinstaller
      - name: Compile and test
        run: |
          python -m compileall -q src
          python -m unittest discover -s tests -v
          python run.py --help
      - name: Build portable executable
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name Victoria3NativeLoader --paths src run.py
      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Victoria3NativeLoader-win-x64
          path: dist/Victoria3NativeLoader.exe
          if-no-files-found: error
      - name: Compile example native DLL
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cd plugins\example_native
          cl.exe /nologo /LD /W4 /O2 /I..\..\sdk example.c /Fe:example_native.dll
      - name: Upload example DLL
        uses: actions/upload-artifact@v4
        with:
          name: V3NL-example-native-DLL
          path: plugins/example_native/example_native.dll
          if-no-files-found: error
