[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "victoria3-native-loader"
version = "0.1.0"
description = "Local Victoria 3 mod/playset launcher with opt-in version-checked native DLL plugins"
requires-python = ">=3.11"
dependencies = [
  "psutil>=6.1",
  "pefile>=2023.2.7",
]

[project.gui-scripts]
victoria3-native-loader = "v3nl.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
